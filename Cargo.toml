[workspace]
resolver = "3"
members = ["rico16-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
rico16-core = { path = "rico16-core" }

clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
winit = "0.30"
pixels = "0.15"
rhai = "=1.27.0"
